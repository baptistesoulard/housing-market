name: Banc d'essai TSFM

# Fait tourner bench/tsfm_benchmark.py avec les modèles de fondation (Chronos-2, Timestral).
# Les poids se téléchargent depuis Hugging Face : le runner GitHub y a accès, ce que n'ont
# pas tous les postes de travail. Ne touche à rien de la chaîne de publication : aucun commit
# sur main, aucun JSON du site. Résultats : artefact, résumé du job et branche de test.
on:
  push:
    branches: ["bench/**"]
    paths: ["bench/**", ".github/workflows/tsfm-benchmark.yml"]
  workflow_dispatch: {}

permissions:
  contents: write               # le rapport revient sur la branche bench/** (pas main)

concurrency:
  group: tsfm-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # torch en version CPU (l'index par défaut tirerait les bibliothèques CUDA, ~3 Go).
      # Timestral épinglé sur un commit : le dépôt vient de sortir et bougera.
      - name: Installer les dépendances
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r bench/requirements.txt

      - name: Cache des poids Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tsfm-v1

      - name: Rejouer la rétro-simulation
        run: |
          python bench/tsfm_benchmark.py --models chronos2 timestral-123M timestral-209M
          cat bench/results/rapport.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tsfm-benchmark
          path: bench/results/

      # Le rapport et la synthèse reviennent aussi sur la branche de test (jamais sur
      # main) : lisibles sans télécharger d'artefact. Un commit fait avec GITHUB_TOKEN ne
      # relance pas ce workflow.
      - name: Committer le rapport sur la branche de test
        if: always() && startsWith(github.ref, 'refs/heads/bench/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/results/rapport.md bench/results/synthese.json
          if git diff --cached --quiet; then
            echo "Rapport inchangé."
          else
            git commit -m "bench: résultats du banc d'essai TSFM (${GITHUB_SHA::7})"
            git push
          fi
