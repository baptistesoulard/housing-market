name: Refresh data sources

# Rafraîchit automatiquement les sources publiques (INSEE / SDES / BCE / IGEDD) et commite
# uniquement les fichiers réellement modifiés — l'écriture hash-guardée de fetch_new_sources.py
# garantit qu'un run « sans nouveauté » ne produit aucun diff. Aucune machine à laisser allumée.
on:
  schedule:
    - cron: "0 6 * * 1"        # tous les lundis 06:00 UTC
  workflow_dispatch: {}         # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write               # nécessaire pour committer/pusher les CSV rafraîchis

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Garde-fou : un endpoint public qui pend (3 tentatives x 120 s de timeout par source)
    # ne doit pas bloquer le runner indéfiniment. Large marge au-dessus du run nominal.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pandas/numpy/xlrd : acquisition des sources. pandera/pyarrow/duckdb : depuis la
      # phase 1 du refactor compute, web_export.py passe par queries.py -> housing_data,
      # donc la couche SQL n'est plus optionnelle pour l'étape d'export ci-dessous.
      #
      # Ce job réécrit les CSV puis reconstruit les Parquet dans la foulée, donc les deux
      # repartent cohérents ici. La garde de fraîcheur de warehouse.resolve() protège le
      # cas SYMÉTRIQUE, côté poste de travail : après un `git pull` qui apporte des CSV
      # rafraîchis, le Parquet local est plus ancien et serait servi à sa place.
      - name: Installer les dépendances (acquisition + couche SQL)
        run: pip install pandas numpy xlrd pandera pyarrow duckdb

      - name: Rafraîchir toutes les sources
        run: python fetch_new_sources.py

      # Sans cette étape les JSON du front resteraient figés à leur dernier export
      # manuel pendant que data_manual_input/ continue d'avancer. web_export.py passe
      # par DataManager.load_or_generate_all(), qui reconstruit d'abord les CSV dérivés
      # (sitadel / macro / sales) depuis les sources fraîchement écrites PUIS écrit les
      # Parquet validés ; les agrégations sont ensuite faites en SQL sur ces Parquet
      # (queries.open_warehouse). D'où les dépendances de la couche SQL installées
      # ci-dessus : sans elles, cette étape échoue à l'import.
      # Ignorée si l'étape précédente est sortie en erreur, c'est-à-dire uniquement
      # quand TOUTES les sources ont échoué : rien de neuf à exporter dans ce cas.
      # AVANT l'export du front, qui lit l'archive pour construire sa page. L'ordre
      # compte aussi dans l'autre sens : ce script ouvre l'entrepôt avec refresh=True,
      # donc il reconstruit lui-même les CSV dérivés et les Parquet depuis les sources
      # fraîchement écrites — il ne dépend pas de l'étape suivante pour les avoir.
      #
      # Une prévision inchangée n'ajoute RIEN au fichier (garde de contenu, comme pour les
      # sources) : les semaines sans nouveauté ne produisent donc aucun diff. Et un modèle
      # que les données du jour ne permettent pas de calibrer n'interrompt pas le job — on
      # perdrait alors une publication de données pour une ligne d'archive.
      - name: Enregistrer la prévision du jour dans l'archive
        run: python forecast_archive.py --record

      - name: Régénérer les données du front web
        run: python web/export/web_export.py

      - name: Committer les données modifiées (le cas échéant)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # a-propos.md est dans la liste parce que web_export.py y réécrit les dates du
          # tableau des sources : cette page doit rester du HTML statique (les robots
          # d'aperçu de partage n'exécutent pas de JS), donc les dates sont commitées
          # comme les JSON. L'oublier ici ferait afficher des dates figées à la dernière
          # publication manuelle, sur la page qui sert justement à établir la provenance.
          git add data_manual_input data/ventes_ancien.csv data/forecast_archive.csv \
                  web/observable/src/data web/observable/src/a-propos.md
          if git diff --cached --quiet; then
            echo "Aucune donnée modifiée — rien à committer."
          else
            git commit -m "chore(data): rafraîchissement automatique des sources"
            git push
          fi
